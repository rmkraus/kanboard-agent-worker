[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanboard-agent-worker"
version = "0.1.0"
description = "Pull-based Kanboard worker for local CLI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.10.1,<0.11",
    "asyncio-pool>=0.6.0,<0.7",
    "httpx>=0.27.1,<1",
    "Jinja2>=3.1.0",
    "mcp>=1.0,<2",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0,<26",
    "pytest>=8.0.0",
    "ruff>=0.8.0,<1",
]

[project.scripts]
kanboard-agent-worker = "kanboard_agent_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.black]
line-length = 120
target-version = ["py311"]
