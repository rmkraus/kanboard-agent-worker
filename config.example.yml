server:
  user: admin
  token: admin
  url: http://localhost:8080

# Optional: required when any board uses `provider: smartsheet`.
smartsheet:
  token: ${SMARTSHEET_TOKEN}
  url: https://api.smartsheet.com/2.0

worker:
  max_concurrency: 1
  poll_interval: 10

roster:
  - name: codex
    description: Repository-oriented coding agent
  - name: claude
    description: General implementation agent

agent:
  name: codex
  pwd: .
  system_prompt: |
    Follow the card instructions and keep the final response concise.
  command:
    - codex-acp
  timeout_seconds: 3600

boards:
  - id: 1
    todo: "Intake"
    working: "In Process"
    blocked: "Escalate"
    done: "Complete"
  # Smartsheet sheet-backed board. The status cell stores one of the four
  # workflow values below; assignee must match server.user.
  - provider: smartsheet
    id: 1234567890123456
    status_column: "Status"
    assignee_column: "Assigned To"
    title_column: "Task"
    description_column: "Spec"
    metadata_column: "Agent Metadata"
    todo: "Intake"
    working: "In Process"
    blocked: "Escalate"
    done: "Complete"
