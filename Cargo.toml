[package]
name = "kanboard-agent-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Pull-based Kanboard worker for local CLI agents"
license = "MIT"
default-run = "kanboard-agent-worker"

[lib]
name = "kanboard_agent_worker"
path = "src/lib.rs"

[[bin]]
name = "kanboard-agent-worker"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "0.14.0"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
schemars = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shlex = "1.3"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.19", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23"
